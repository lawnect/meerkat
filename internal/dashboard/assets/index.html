<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meerkat</title><style>body{margin:0;background:#10151b;color:#e9eef5;font:15px system-ui,sans-serif}main{max-width:900px;margin:64px auto;padding:0 24px}h1{font-size:32px}section{background:#19222d;border:1px solid #2c3a49;border-radius:12px;padding:24px;margin-top:20px}input,button{box-sizing:border-box;padding:11px;border-radius:7px;border:1px solid #405166;font:inherit}input{width:100%;background:#10151b;color:#fff;margin:6px 0 12px}button{background:#6ee7b7;color:#102018;font-weight:700;cursor:pointer}button.secondary{background:transparent;color:#e9eef5}small,.muted{color:#a9b6c5}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.error{color:#fca5a5}.connector{padding:13px 0;border-top:1px solid #2c3a49}</style><main><div class="row"><div><h1>Meerkat</h1><p class="muted">Outlet control plane</p></div><button id="logout" class="secondary" hidden>로그아웃</button></div><section id="loading">상태를 확인하는 중입니다.</section></main><script>const el=document.querySelector('#loading'),logout=document.querySelector('#logout');const json=(u,o={})=>fetch(u,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(o.headers||{})},...o}).then(async r=>{let b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.code||'request_failed');return b});function setup(){el.innerHTML=`<h2>초기 관리자 설정</h2><p class=muted>서버의 admin.token 파일에 있는 1회성 코드를 사용합니다.</p><input id=code placeholder="설정 코드"><input id=email type=email placeholder="이메일"><input id=password type=password placeholder="비밀번호 (12자 이상)"><button id=save>관리자 만들기</button><p class=error id=err></p>`;save.onclick=async()=>{try{await json('/api/v1/setup/admin',{method:'POST',headers:{Authorization:'Bearer '+code.value},body:JSON.stringify({email:email.value,password:password.value})});login()}catch(e){err.textContent='설정에 실패했습니다: '+e.message}}}function login(){el.innerHTML=`<h2>로그인</h2><input id=email type=email placeholder="이메일"><input id=password type=password placeholder="비밀번호"><button id=enter>로그인</button><p class=error id=err></p>`;enter.onclick=async()=>{try{await json('/api/v1/session',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});dashboard()}catch(e){err.textContent='로그인에 실패했습니다.'}}}async function dashboard(){try{let d=await json('/api/v1/connectors');logout.hidden=false;el.innerHTML='<h2>Connectors</h2><p class=muted>'+d.connectors.length+'개 등록됨</p>'+(d.connectors.map(c=>`<div class=connector><b>${c.name}</b><br><small>${c.status} · ${c.tunnel_status}</small></div>`).join('')||'<p class=muted>아직 등록된 Connector가 없습니다.</p>')}catch(_){login()}}logout.onclick=async()=>{await fetch('/api/v1/session',{method:'DELETE',credentials:'same-origin'});logout.hidden=true;login()};json('/api/v1/setup/status').then(s=>s.setup_complete?dashboard():setup()).catch(()=>el.textContent='Outlet API에 연결할 수 없습니다.');</script></html>
