<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meerkat Outlet</title>
<style>
:root{--paper:#f3f1eb;--panel:#fffefa;--ink:#20252a;--muted:#6c747b;--line:#d9d7d0;--accent:#c85f38;--accent-dark:#9f4528;--green:#35735d;--amber:#a66a20}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #e7a58d;outline-offset:2px}
.topbar{height:64px;background:#242a2f;color:#f8f6ef;display:flex;align-items:center;padding:0 32px;gap:26px;border-bottom:1px solid #15191c}.brand{font-size:16px;font-weight:760;letter-spacing:.08em}.brand small{color:#b8c0c2;font-size:10px;letter-spacing:.14em;margin-left:7px}.topbar-meta{margin-left:auto;display:flex;align-items:center;gap:18px;color:#c3c9c9;font-size:12px}.topbar button{border:0;background:transparent;color:#e8ece8;padding:6px 0}
.layout{min-height:calc(100vh - 64px);display:grid;grid-template-columns:232px minmax(0,1fr)}.rail{border-right:1px solid var(--line);background:#ebe9e2;padding:24px 16px;display:flex;flex-direction:column}.rail-label{color:#85857f;font-size:11px;font-weight:700;letter-spacing:.1em;margin:0 10px 9px;text-transform:uppercase}.nav{display:grid;gap:3px}.nav button{border:0;border-left:3px solid transparent;background:transparent;text-align:left;color:#4f5659;padding:10px 11px;border-radius:2px}.nav button:hover{background:#e2dfd7}.nav button.active{border-left-color:var(--accent);background:#fffefa;color:var(--ink);font-weight:700}.rail-note{margin-top:auto;border-top:1px solid var(--line);padding:18px 10px 0;color:var(--muted);font-size:12px}.rail-note strong{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}.content{max-width:1180px;width:100%;padding:38px 48px 72px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:28px}.eyebrow{color:var(--accent-dark);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0 0 7px}.page-head h1{font-size:29px;line-height:1.15;margin:0 0 6px;letter-spacing:-.04em}.page-head p{color:var(--muted);margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}
.button{border:1px solid var(--accent-dark);background:var(--accent);color:white;padding:9px 14px;border-radius:3px;font-weight:700}.button:hover{background:var(--accent-dark)}.button.secondary{background:var(--panel);color:var(--ink);border-color:#aaa9a1}.button.quiet{background:transparent;color:var(--muted);border-color:var(--line)}.button:disabled{cursor:not-allowed;opacity:.5}.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#9a9d9a;margin-right:6px;vertical-align:1px}.status-dot.ok{background:#3a8a6b}.status-dot.warn{background:#c98a27}.status-dot.bad{background:#bb4d3d}.status{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:16px}.summary-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:30px}.stat{background:var(--panel);border:1px solid var(--line);padding:17px 18px}.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:25px;font-weight:750;letter-spacing:-.04em;margin-top:3px}.stat-note{color:var(--muted);font-size:11px;margin-top:2px}.panel{background:var(--panel);border:1px solid var(--line);padding:22px}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}.panel h2{font-size:17px;margin:0;letter-spacing:-.025em}.panel h3{font-size:14px;margin:0 0 5px}.panel p{margin:0;color:var(--muted)}.panel-head p{font-size:12px}.two-col{grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr)}
.steps{display:grid;gap:0;margin:4px 0 0}.step{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:13px 0}.step:last-child{border-bottom:0}.step-no{width:25px;height:25px;border:1px solid #aaa99f;border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--muted)}.step.done .step-no{background:var(--green);border-color:var(--green);color:white}.step strong{display:block;font-size:13px}.step small{color:var(--muted)}.step-action{color:var(--accent-dark);font-size:12px;font-weight:700}
.empty{border:1px dashed #b9b6ad;background:#fbfaf5;padding:30px;text-align:center}.empty h2{font-size:19px;margin:0 0 7px}.empty p{max-width:510px;margin:0 auto 18px;color:var(--muted)}.callout{border-left:3px solid var(--accent);background:#fbf3ed;padding:13px 15px;color:#5f4b42;font-size:13px}.callout strong{display:block;color:var(--ink);margin-bottom:2px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#4f5759}.field small{color:var(--muted);font-size:11px}.field input{width:100%;border:1px solid #bcbab2;background:#fffefa;color:var(--ink);border-radius:2px;padding:10px 11px}.form-actions{display:flex;align-items:center;gap:10px;margin-top:17px}.error{color:#a54134!important;font-size:12px;margin-top:10px!important}.success{color:var(--green)!important;font-size:12px;margin-top:10px!important}
.connector-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px}.connector-list{padding:0}.connector-item{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:14px 16px;color:var(--ink)}.connector-item:first-child{border-top:1px solid var(--line)}.connector-item:hover,.connector-item.selected{background:#f5eee8}.connector-item strong{display:block;font-size:13px}.connector-item small{color:var(--muted)}.detail-title{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.service{border-top:1px solid var(--line);padding:17px 0}.service:first-of-type{border-top:0;padding-top:0}.service-meta{color:var(--muted);font-size:12px}.route-line{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:#fbfaf5;padding:10px 12px;margin-top:10px}.route-line code{font-size:12px;color:#345a70}.token-box{margin-top:16px;background:#242a2f;color:#f5f3ec;padding:16px}.token-box p{color:#c2c8c5;font-size:12px}.token-box input{width:100%;margin:10px 0;border:1px solid #59636a;background:#171c20;color:#fff;padding:10px;border-radius:2px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px}.token-box .button{background:#e7a27f;border-color:#e7a27f;color:#2b201b}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper)}.auth{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);padding:34px}.auth-brand{font-size:13px;font-weight:800;letter-spacing:.1em;margin-bottom:42px}.auth h1{font-size:27px;letter-spacing:-.04em;margin:0 0 8px}.auth-intro{color:var(--muted);margin:0 0 25px}.auth .field{margin-top:14px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid var(--line);padding:10px 16px;display:block}.rail-label,.rail-note{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}.nav button.active{border-bottom-color:var(--accent)}.content{padding:28px 22px 56px}.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col,.connector-layout{grid-template-columns:1fr}}
@media(max-width:560px){.topbar{padding:0 18px}.topbar-meta span{display:none}.content{padding:24px 16px 48px}.page-head{display:block}.actions{margin-top:18px}.summary-grid{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:13px}.stat-value{font-size:21px}.panel{padding:17px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.detail-title{display:block}.detail-title .status{margin-top:8px}}
</style>
<div id="root"></div>
<script>
const root=document.querySelector('#root');let selected=null,enrollment=null,currentView='overview',cached={connectors:[],services:[],routes:[],outlet:null};
const json=(url,options={})=>fetch(url,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}}).then(async response=>{const body=await response.json().catch(()=>({}));if(!response.ok)throw Error(body.code||'request_failed');return body});
const node=(tag,text)=>{const el=document.createElement(tag);if(text!==undefined)el.textContent=text;return el};
function field(label,placeholder,type='text',value=''){const wrap=node('div');wrap.className='field';const l=node('label',label);const input=node('input');input.placeholder=placeholder;input.type=type;input.required=true;input.value=value;wrap.append(l,input);return {wrap,input}}
function button(text,type='button'){const b=node('button',text);b.type=type;b.className='button';return b}
function formActions(...children){const wrap=node('div');wrap.className='form-actions';wrap.append(...children);return wrap}
function status(text,kind=''){const span=node('span');span.className='status';const dot=node('i');dot.className='status-dot '+kind;span.append(dot,node('span',text));return span}
function statusLabel(value){return ({draft:'등록 대기',connected:'연결됨',connecting:'연결 중',stale:'응답 없음',disconnected:'연결 끊김',unknown:'확인 대기',error:'오류'})[value]||value||'확인 대기'}
function statusKind(value){return value==='connected'?'ok':(['error','stale','disconnected'].includes(value)?'bad':'warn')}
function panel(title,description,body){const p=node('section');p.className='panel';const head=node('div');head.className='panel-head';const titleWrap=node('div');titleWrap.append(node('h2',title));if(description)titleWrap.append(node('p',description));head.append(titleWrap);p.append(head,body);return p}
function authFrame(title,intro,content){const wrap=node('div');wrap.className='auth-wrap';const card=node('section');card.className='auth';card.append(node('div','MEERKAT / OUTLET'),node('h1',title),node('p',intro),content);wrap.append(card);root.replaceChildren(wrap)}
function setup(){const form=node('form');const code=field('설정 코드','서버의 admin.token 값'),email=field('관리자 이메일','you@example.com','email'),password=field('비밀번호','12자 이상','password');const submit=button('관리자 만들기','submit'),message=node('p');message.className='error';form.append(code.wrap,email.wrap,password.wrap,formActions(submit,message));form.onsubmit=async e=>{e.preventDefault();try{await json('/api/v1/setup/admin',{method:'POST',headers:{Authorization:'Bearer '+code.input.value.trim()},body:JSON.stringify({email:email.input.value,password:password.input.value})});login()}catch(err){message.textContent=err.message==='invalid_setup_credential'?'설정 코드, 이메일 또는 비밀번호를 확인하세요. 비밀번호는 12자 이상이어야 합니다.':'설정에 실패했습니다: '+err.message}};authFrame('처음 한 번만 설정하세요','이 서버의 관리자가 사용할 계정을 만듭니다. 설정 코드는 서버에서만 확인할 수 있습니다.',form)}
function login(){const form=node('form');const email=field('이메일','you@example.com','email'),password=field('비밀번호','비밀번호','password');const submit=button('로그인','submit'),message=node('p');message.className='error';form.append(email.wrap,password.wrap,formActions(submit,message));form.onsubmit=async e=>{e.preventDefault();try{await json('/api/v1/session',{method:'POST',body:JSON.stringify({email:email.input.value,password:password.input.value})});await dashboard()}catch(_){message.textContent='이메일 또는 비밀번호가 올바르지 않습니다.'}};authFrame('로그인','Meerkat Outlet 운영 콘솔에 접속합니다.',form)}
function shell(){const wrap=node('div');wrap.innerHTML='<header class="topbar"><div class="brand">MEERKAT <small>OUTLET</small></div><div class="topbar-meta"><span id="top-domain"></span><span id="top-status"></span><button id="logout">로그아웃</button></div></header><div class="layout"><aside class="rail"><p class="rail-label">운영</p><nav class="nav"><button data-view="overview">개요</button><button data-view="connectors">Connector</button><button data-view="routes">공개 서비스</button><button data-view="settings">설정</button></nav><div class="rail-note"><strong>도움이 필요하신가요?</strong>공개 서비스는 Connector가 연결된 뒤 외부에서 접근할 수 있습니다.</div></aside><main class="content" id="content"></main></div>';root.replaceChildren(wrap);wrap.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{currentView=b.dataset.view;renderView()});wrap.querySelector('#logout').onclick=async()=>{await fetch('/api/v1/session',{method:'DELETE',credentials:'same-origin'});login()};return wrap}
function head(kicker,title,description,action){const h=node('div');h.className='page-head';const copy=node('div');const k=node('p',kicker);k.className='eyebrow';copy.append(k,node('h1',title),node('p',description));h.append(copy);if(action)h.append(action);return h}
function summaryStat(label,value,note){const s=node('div');s.className='stat';const a=node('div',label),b=node('div',value),c=node('div',note);a.className='stat-label';b.className='stat-value';c.className='stat-note';s.append(a,b,c);return s}
function overview(){const content=document.querySelector('#content');const connectors=cached.connectors;const connected=connectors.filter(c=>c.status==='connected').length;const next=connectors.length===0?'Connector를 하나 만들어 내부 서비스를 연결하세요.':connected===0?'Connector를 실행하고 등록 토큰으로 연결하세요.':'공개 서비스의 상태를 확인하세요.';const quick=button(connectors.length?'공개 서비스 보기':'Connector 시작');quick.onclick=()=>{currentView=connectors.length?'routes':'connectors';renderView()};content.replaceChildren(head('MEERKAT OUTLET','오늘의 운영 상태',next,quick));const sg=node('div');sg.className='grid summary-grid';sg.append(summaryStat('Connector',connectors.length,'등록된 서버'),summaryStat('연결됨',connected,'heartbeat 기준'),summaryStat('내부 서비스',cached.services.length,'등록된 앱'),summaryStat('공개 주소',cached.routes.length,'생성된 Route'));content.append(sg);const main=node('div');main.className='grid two-col';const steps=node('div');steps.className='steps';const items=[['도메인 확인',!!cached.outlet.domain,'설정에서 변경'],['Connector 만들기',connectors.length>0,'서버 등록'],['Connector 연결',connected>0,'등록 토큰 발급'],['공개 서비스 만들기',cached.routes.length>0,'서비스 추가']];items.forEach((item,i)=>{const row=node('div');row.className='step'+(item[1]?' done':'');const n=node('div',item[1]?'✓':String(i+1));n.className='step-no';const copy=node('div');copy.append(node('strong',item[0]),node('small',item[1]?'완료됨':item[2]));const a=node('span',item[1]?'완료':item[2]);a.className='step-action';row.append(n,copy,a);steps.append(row)});const checklist=panel('시작하기','Meerkat에서 서비스를 공개하는 순서입니다.',steps);const aside=node('div');const note=node('div');note.className='callout';note.append(node('strong','현재 할 일'),node('span',next));aside.append(note);const help=node('div');help.className='panel';help.style.marginTop='16px';help.append(node('h2','용어 안내'),node('p','Connector는 서비스를 실행하는 서버입니다. 공개 서비스는 서버 안의 앱 하나와 인터넷 주소 하나를 연결합니다.'));aside.append(help);main.append(checklist,aside);content.append(main)}
function outletForm(){const form=node('form');const domain=field('기본 도메인','예: saeoo.com','text',cached.outlet.domain||'');const save=button(cached.outlet.domain?'저장':'도메인 설정','submit'),msg=node('p');msg.className='error';form.append(domain.wrap,formActions(save,msg));form.onsubmit=async e=>{e.preventDefault();try{await json('/api/v1/outlet',{method:'PUT',body:JSON.stringify({domain:domain.input.value})});await dashboard()}catch(err){msg.textContent='도메인을 저장하지 못했습니다: '+err.message}};const body=node('div');body.append(node('p','모든 공개 서비스는 이 도메인의 하위 주소로 만들어집니다. 예: app.saeoo.com.'),form);return panel('기본 도메인','Caddy가 인증서와 공개 주소를 관리할 기준입니다.',body)}
function connectorForm(){const form=node('form');const name=field('이름','예: home-server'),create=button('Connector 만들기','submit'),msg=node('p');msg.className='error';form.append(name.wrap,formActions(create,msg));form.onsubmit=async e=>{e.preventDefault();try{const c=await json('/api/v1/connectors',{method:'POST',body:JSON.stringify({name:name.input.value})});selected=c.id;enrollment=null;await dashboard()}catch(err){msg.textContent='Connector를 만들지 못했습니다: '+err.message}};return form}
function enrollmentPanel(connector){const body=node('div');body.append(node('p','Connector를 설치할 서버에서 이 토큰을 사용합니다. 한 번만 표시되며 만료 후에는 새로 발급해야 합니다.'));const issue=button('등록 토큰 발급'),msg=node('p');msg.className='error';issue.onclick=async()=>{try{enrollment=await json('/api/v1/connectors/'+encodeURIComponent(connector.id)+'/enrollment-tokens',{method:'POST'});renderView()}catch(err){msg.textContent='토큰을 발급하지 못했습니다: '+err.message}};body.append(issue,msg);if(enrollment){const box=node('div');box.className='token-box';box.append(node('strong','지금 복사하세요'),node('p','이 화면을 닫으면 토큰을 다시 확인할 수 없습니다.'));const input=node('input');input.value=enrollment.token;input.readOnly=true;const copy=button('토큰 복사');copy.onclick=()=>navigator.clipboard?.writeText(enrollment.token);box.append(input,copy,node('p','만료: '+new Date(enrollment.expires_at).toLocaleString()));body.append(box)}return panel('Connector 연결','등록 토큰을 발급하고 Connector 서버에 설치합니다.',body)}
async function serviceBlock(service,connector){const block=node('div');block.className='service';const title=node('div');title.className='detail-title';const t=node('div');t.append(node('h3',service.name),node('div',(connector?connector.name+' · ':'')+service.protocol+' · '+service.target.host+':'+service.target.port));t.lastChild.className='service-meta';title.append(t,status(statusLabel(service.observed_status),statusKind(service.observed_status)));block.append(title);try{const data=await json('/api/v1/services/'+encodeURIComponent(service.id)+'/routes');if(!data.routes.length){const empty=node('p','아직 공개 주소가 없습니다.');empty.className='muted';block.append(empty)}data.routes.forEach(route=>{const line=node('div');line.className='route-line';line.append(node('code','https://'+route.hostname),node('span','연결 후 자동 공개'));block.append(line)});const form=node('form');form.className='form-actions';const host=field('','예: app.saeoo.com');host.wrap.style.flex='1';const submit=button('공개 주소 추가','submit'),msg=node('span');msg.className='error';form.append(host.wrap,submit,msg);form.onsubmit=async e=>{e.preventDefault();try{await json('/api/v1/services/'+encodeURIComponent(service.id)+'/routes',{method:'POST',body:JSON.stringify({hostname:host.input.value})});dashboard()}catch(err){msg.textContent='공개 주소를 만들지 못했습니다: '+err.message}};block.append(form)}catch(_){const msg=node('p','서비스 상태를 불러오지 못했습니다.');msg.className='error';block.append(msg)}return block}
async function connectorDetail(connector){const body=node('div');const title=node('div');title.className='detail-title';title.append(node('div',connector.name),status(statusLabel(connector.status),statusKind(connector.status)));title.firstChild.style.fontWeight='750';title.firstChild.style.fontSize='18px';body.append(title);const serviceList=node('div');try{const data=await json('/api/v1/connectors/'+encodeURIComponent(connector.id)+'/services');if(!data.services.length){const empty=node('div');empty.className='empty';empty.style.marginTop='18px';empty.append(node('h2','아직 서비스가 없습니다'),node('p','이 Connector가 연결할 내부 앱의 주소와 포트를 등록하세요.'));serviceList.append(empty)}else for(const s of data.services)serviceList.append(await serviceBlock(s,connector))}catch(_){serviceList.append(node('p','서비스를 불러오지 못했습니다.'))}const form=node('form');form.className='grid form-grid';const name=field('서비스 이름','예: memo'),host=field('내부 호스트','예: memo-app'),port=field('내부 포트','예: 3000','number');form.append(name.wrap,host.wrap,port.wrap);const submit=button('내부 서비스 등록','submit'),msg=node('p');msg.className='error';form.append(formActions(submit,msg));form.onsubmit=async e=>{e.preventDefault();try{await json('/api/v1/connectors/'+encodeURIComponent(connector.id)+'/services',{method:'POST',body:JSON.stringify({name:name.input.value,protocol:'http',target:{host:host.input.value,port:Number(port.input.value)}})});dashboard()}catch(err){msg.textContent='서비스를 등록하지 못했습니다: '+err.message}};const newTitle=node('h3','새 내부 서비스');newTitle.style.marginTop='22px';const existingTitle=node('h3','등록된 서비스');existingTitle.style.marginTop='28px';body.append(newTitle,form,existingTitle,serviceList,enrollmentPanel(connector));return panel('서비스와 공개 주소','먼저 내부 앱을 등록하고, 그 다음 외부에서 사용할 주소를 추가합니다.',body)}
async function connectorsPage(){const content=document.querySelector('#content');content.replaceChildren(head('운영 / CONNECTOR','서버 연결','서비스를 실행하는 서버를 등록하고 연결 상태를 관리합니다.'));const layout=node('div');layout.className='connector-layout';const left=node('section');left.className='panel';left.append(node('h2','새 Connector 등록'));const form=connectorForm();left.append(form);const listTitle=node('h2','등록된 Connector');listTitle.style.marginTop='28px';left.append(listTitle);const list=node('div');list.className='connector-list';cached.connectors.forEach(c=>{const b=node('button');b.className='connector-item'+(selected===c.id?' selected':'');b.append(node('strong',c.name),status(statusLabel(c.status),statusKind(c.status)));b.onclick=()=>{selected=c.id;enrollment=null;renderView()};list.append(b)});left.append(list);const right=node('div');const c=cached.connectors.find(x=>x.id===selected);if(!c){right.className='panel';const empty=node('div');empty.className='empty';empty.append(node('h2','Connector를 선택하세요'),node('p','왼쪽에서 서버를 선택하면 서비스 등록과 설치 안내가 표시됩니다.'));right.append(empty)}else right.append(await connectorDetail(c));layout.append(left,right);content.append(layout)}
async function routesPage(){const content=document.querySelector('#content');const manage=button('Connector 관리');manage.onclick=()=>{currentView='connectors';renderView()};content.replaceChildren(head('운영 / PUBLIC SERVICES','공개 서비스','내부 앱과 인터넷 주소가 연결된 현황입니다.',manage));const body=node('div');let count=0;for(const c of cached.connectors){try{const data=await json('/api/v1/connectors/'+encodeURIComponent(c.id)+'/services');if(!data.services.length)continue;const groupBody=node('div');for(const s of data.services){count++;groupBody.append(await serviceBlock(s,c))}body.append(panel(c.name,statusLabel(c.status),groupBody))}catch(_){}}if(!count){const empty=node('div');empty.className='empty';empty.append(node('h2','아직 공개 서비스가 없습니다'),node('p','Connector를 선택하고 내부 서비스를 등록한 뒤, 원하는 서브도메인을 추가하세요.'));body.append(empty)}content.append(body)}
function settingsPage(){const content=document.querySelector('#content');content.replaceChildren(head('설정','Outlet 설정','공개 주소의 기준과 서버 상태를 확인합니다.'),outletForm())}
function renderView(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView));document.querySelector('#top-domain').textContent=cached.outlet.domain||'도메인 미설정';document.querySelector('#top-status').replaceChildren(status('Outlet 정상','ok'));if(currentView==='overview')overview();else if(currentView==='connectors')connectorsPage();else if(currentView==='routes')routesPage();else settingsPage()}
async function dashboard(){try{const [connectorData,outlet]=await Promise.all([json('/api/v1/connectors'),json('/api/v1/outlet')]);const connectors=connectorData.connectors;const groups=await Promise.all(connectors.map(async connector=>{const data=await json('/api/v1/connectors/'+encodeURIComponent(connector.id)+'/services');return Promise.all(data.services.map(async service=>{const routeData=await json('/api/v1/services/'+encodeURIComponent(service.id)+'/routes');return {service,connector,routes:routeData.routes}}))}));const records=groups.flat();cached={connectors,services:records.map(record=>record.service),routes:records.flatMap(record=>record.routes),outlet};shell();renderView()}catch(_){login()}}
json('/api/v1/setup/status').then(s=>s.setup_complete?dashboard():setup()).catch(()=>authFrame('연결할 수 없습니다','Outlet API에 연결할 수 없습니다. 서버 상태와 인증서를 확인하세요.',node('p','잠시 후 다시 시도하세요.')));
</script>
</html>
