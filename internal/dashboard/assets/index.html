<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meerkat</title>
<style>
body{margin:0;background:#10151b;color:#e9eef5;font:15px system-ui,sans-serif}main{max-width:900px;margin:64px auto;padding:0 24px}h1{font-size:32px}h2{margin-top:0}section{background:#19222d;border:1px solid #2c3a49;border-radius:12px;padding:24px;margin-top:20px}input,button{box-sizing:border-box;padding:11px;border-radius:7px;border:1px solid #405166;font:inherit}input{width:100%;background:#10151b;color:#fff;margin:6px 0 12px}button{background:#6ee7b7;color:#102018;font-weight:700;cursor:pointer}.secondary{background:transparent;color:#e9eef5}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.error{color:#fca5a5}.muted,small{color:#a9b6c5}.connector{display:block;width:100%;text-align:left;background:transparent;color:#e9eef5;border:0;border-top:1px solid #2c3a49;border-radius:0}.connector.selected{background:#223142}.hidden{display:none}
</style>
<main>
  <div class="row"><div><h1>Meerkat</h1><p class="muted">Outlet control plane</p></div><button id="logout" class="secondary hidden">로그아웃</button></div>
  <section id="app">상태를 확인하는 중입니다.</section>
</main>
<script>
const app=document.querySelector('#app'),logout=document.querySelector('#logout');let selected=null;
const json=(url,options={})=>fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options}).then(async response=>{const body=await response.json().catch(()=>({}));if(!response.ok)throw Error(body.code||'request_failed');return body});
const node=(tag,text)=>{const element=document.createElement(tag);if(text!==undefined)element.textContent=text;return element};
function input(placeholder,type='text'){const field=node('input');field.placeholder=placeholder;field.type=type;field.required=true;return field}
function setup(){app.replaceChildren(node('h2','초기 관리자 설정'),node('p','서버의 admin.token 파일에 있는 1회성 코드를 사용합니다.'));const form=node('form'),code=input('설정 코드'),email=input('이메일','email'),password=input('비밀번호 (12자 이상)','password'),submit=node('button','관리자 만들기'),message=node('p');message.className='error';form.append(code,email,password,submit,message);form.onsubmit=async event=>{event.preventDefault();try{await json('/api/v1/setup/admin',{method:'POST',headers:{Authorization:'Bearer '+code.value},body:JSON.stringify({email:email.value,password:password.value})});login()}catch(e){message.textContent='설정에 실패했습니다: '+e.message}};app.append(form)}
function login(){app.replaceChildren(node('h2','로그인'));const form=node('form'),email=input('이메일','email'),password=input('비밀번호','password'),submit=node('button','로그인'),message=node('p');message.className='error';form.append(email,password,submit,message);form.onsubmit=async event=>{event.preventDefault();try{await json('/api/v1/session',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});dashboard()}catch(_){message.textContent='로그인에 실패했습니다.'}};app.append(form)}
async function dashboard(){try{const [data,outlet]=await Promise.all([json('/api/v1/connectors'),json('/api/v1/outlet')]);logout.classList.remove('hidden');render(data.connectors,outlet)}catch(_){logout.classList.add('hidden');login()}}
function outletForm(outlet){const section=node('section'),title=node('h2','Outlet domain'),hint=node('p','Meerkat이 인증서와 Route를 관리할 기준 도메인입니다. 이 도메인 또는 하위 도메인만 Route로 등록할 수 있습니다.');hint.className='muted';const form=node('form'),domain=input('예: saeoo.com');domain.value=outlet.domain||'';const submit=node('button',outlet.domain?'도메인 저장':'도메인 설정'),message=node('p');message.className='error';form.append(domain,submit,message);form.onsubmit=async event=>{event.preventDefault();try{await json('/api/v1/outlet',{method:'PUT',body:JSON.stringify({domain:domain.value})});dashboard()}catch(e){message.textContent='저장에 실패했습니다: '+e.message}};section.append(title,hint,form);return section}
function render(connectors,outlet){app.replaceChildren(outletForm(outlet));const heading=node('h2','Connectors'),hint=node('p','Connector는 서비스를 실행하는 서버 또는 Compose 네트워크를 뜻합니다. Service와 Route를 만들기 전에는 외부에 공개되지 않습니다.');hint.className='muted';const form=node('form'),name=input('예: home-server'),create=node('button','Connector 만들기'),message=node('p');message.className='error';form.append(name,create,message);form.onsubmit=async event=>{event.preventDefault();try{const connector=await json('/api/v1/connectors',{method:'POST',body:JSON.stringify({name:name.value})});selected=connector.id;dashboard()}catch(e){message.textContent='생성에 실패했습니다: '+e.message}};app.append(heading,hint,form);if(!connectors.length){const empty=node('p','아직 Connector가 없습니다.');empty.className='muted';app.append(empty);return}const list=node('div');for(const connector of connectors){const button=node('button',connector.name+' · '+connector.status);button.className='connector'+(connector.id===selected?' selected':'');button.onclick=()=>{selected=connector.id;dashboard()};list.append(button)}app.append(list);if(selected&&connectors.some(connector=>connector.id===selected))services(selected)}
async function services(connectorID){const section=node('section'),title=node('h2','Services'),hint=node('p','Service는 Connector가 접속할 내부 앱입니다. 예: app:3000. 아직 도메인으로 공개되지는 않습니다.');hint.className='muted';section.append(title,hint);app.append(section);try{const data=await json('/api/v1/connectors/'+encodeURIComponent(connectorID)+'/services');for(const service of data.services){const item=node('p');item.append(node('b',service.name),node('br'),node('small',service.protocol+' · '+service.target.host+':'+service.target.port+' · '+service.observed_status));section.append(item)}const form=node('form'),name=input('예: web'),host=input('내부 호스트 예: app'),port=input('포트 예: 3000','number'),submit=node('button','HTTP Service 만들기'),message=node('p');message.className='error';port.min='1';port.max='65535';form.append(name,host,port,submit,message);form.onsubmit=async event=>{event.preventDefault();try{await json('/api/v1/connectors/'+encodeURIComponent(connectorID)+'/services',{method:'POST',body:JSON.stringify({name:name.value,protocol:'http',target:{host:host.value,port:Number(port.value)}})});dashboard()}catch(e){message.textContent='생성에 실패했습니다: '+e.message}};section.append(form)}catch(e){const message=node('p','Service를 불러오지 못했습니다: '+e.message);message.className='error';section.append(message)}}
logout.onclick=async()=>{await fetch('/api/v1/session',{method:'DELETE',credentials:'same-origin'});logout.classList.add('hidden');selected=null;login()};
json('/api/v1/setup/status').then(status=>status.setup_complete?dashboard():setup()).catch(()=>app.textContent='Outlet API에 연결할 수 없습니다.');
</script>
</html>
