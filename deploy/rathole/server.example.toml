# rathole v0.5.0: replace all placeholders before running. Keep mode 0600.
# The Outlet listens on the public tunnel port (2333), admits connections and
# proxies them to bind_addr, which is loopback in the Outlet's network namespace.
[server]
bind_addr = "127.0.0.1:2334"

[server.transport]
type = "noise"

[server.transport.noise]
pattern = "Noise_NK_25519_ChaChaPoly_BLAKE2s"
local_private_key = "<base64-server-X25519-private-key>"

[server.services.service_example]
type = "tcp"
token = "<random-service-token>"
bind_addr = "127.0.0.1:31001"
