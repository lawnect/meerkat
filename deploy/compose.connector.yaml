# Coolify test stack: a whoami HTTP app and its Meerkat Connector.
# Replace the tunnel-token placeholder before deploying. The same token can
# reconnect after a container replacement; runtime files use ephemeral storage.
name: meerkat-coolify-test

x-runtime: &runtime
  image: ghcr.io/lawnect/meerkat:latest
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  init: true
  restart: unless-stopped

services:
  app:
    image: traefik/whoami:v1.12.0
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [service]

  connector:
    <<: *runtime
    environment:
      MEERKAT_OUTLET: https://meerkat.example.com
      MEERKAT_NAME: coolify-test
      MEERKAT_DATA_DIR: /var/lib/meerkat
      MEERKAT_TARGET: app:80
      MEERKAT_ENROLLMENT_TOKEN: REPLACE_WITH_OUTLET_TUNNEL_TOKEN
    tmpfs:
      - /var/lib/meerkat:uid=65532,gid=65532,mode=0700
    networks: [control, service]
    depends_on: [app]

networks:
  control: {}
  service:
    internal: true
