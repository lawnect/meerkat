# Coolify test stack: a whoami HTTP app and its Meerkat Connector.
# Replace the enrollment-token placeholder before deploying. The Connector's
# generated identity and credentials live in a named volume across redeploys.
name: meerkat-coolify-test

x-runtime: &runtime
  image: ghcr.io/lawnect/meerkat:latest
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  init: true
  restart: unless-stopped

services:
  app:
    image: traefik/whoami:v1.12.0
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [service]

  connector:
    <<: *runtime
    environment:
      MEERKAT_OUTLET: https://meerkat.saeoo.com
      MEERKAT_NAME: coolify-test
      MEERKAT_DATA_DIR: /var/lib/meerkat
      MEERKAT_TARGET: app:80
      MEERKAT_ENROLLMENT_TOKEN: REPLACE_WITH_OUTLET_ENROLLMENT_TOKEN
    volumes:
      - connector-data:/var/lib/meerkat
    networks: [control, service]
    depends_on: [app]

networks:
  control: {}
  service:
    internal: true

volumes:
  connector-data:
