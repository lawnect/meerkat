name: Publish container images

# A release tag builds one image:
#   meerkat-vX.Y.Z        -> ghcr.io/<repo>:vX.Y.Z        (Outlet, Connector, rathole)
#   meerkat-caddy-vX.Y.Z  -> ghcr.io/<repo>-caddy:vX.Y.Z  (pinned Caddy)
# A tag without a pre-release suffix also moves :latest. Running the workflow
# by hand from such a tag rebuilds that release.
on:
  push:
    tags:
      - 'meerkat-v*'
      - 'meerkat-caddy-v*'
  workflow_dispatch:

# Nothing by default: each job asks for what it uses.
permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Read the release tag
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.tag.outputs.name }}
      image: ${{ steps.tag.outputs.image }}
      dockerfile: ${{ steps.tag.outputs.dockerfile }}
      version: ${{ steps.tag.outputs.version }}
      latest: ${{ steps.tag.outputs.latest }}
    steps:
      - name: Parse tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::Run this workflow from a meerkat-vX.Y.Z or meerkat-caddy-vX.Y.Z tag."
            exit 1
          fi
          case "$TAG" in
            meerkat-caddy-v*) image=meerkat-caddy; dockerfile=deploy/Dockerfile.caddy; version="${TAG#meerkat-caddy-v}" ;;
            meerkat-v*)       image=meerkat;       dockerfile=deploy/Dockerfile;       version="${TAG#meerkat-v}" ;;
            *) echo "::error::$TAG is not a meerkat-vX.Y.Z or meerkat-caddy-vX.Y.Z tag."; exit 1 ;;
          esac
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$version in $TAG is not a semantic version such as 1.0.0 or 1.1.0-rc.1."
            exit 1
          fi
          latest=true
          case "$version" in *-*) latest=false ;; esac
          repo=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          {
            echo "name=$image"
            echo "image=ghcr.io/${repo%/*}/$image"
            echo "dockerfile=$dockerfile"
            echo "version=$version"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
          echo "Building $image v$version (latest: $latest)" >> "$GITHUB_STEP_SUMMARY"

  # The Outlet and Connector image is built from the Go code, so it waits for
  # vet, tests and the vulnerability scan, run with the Go version that image
  # builds with. The Caddy image holds none of it and skips the check.
  verify:
    name: Verify the Go code
    needs: release
    if: needs.release.outputs.name == 'meerkat'
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  build:
    name: Build ${{ matrix.arch }}
    needs: [release, verify]
    # A skipped verify (the Caddy image) doesn't stop the build; a failed one does.
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.verify.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ needs.release.outputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ needs.release.outputs.version }}
          push: true
          tags: ${{ needs.release.outputs.image }}:${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
          # The cache lives next to the image in GHCR: the Actions cache is capped
          # at 10 GB per repository and evicted the rathole build, which then
          # took a minute and a half on every release. A failed cache push
          # warns instead of failing a release whose image is already pushed.
          cache-from: type=registry,ref=${{ needs.release.outputs.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ needs.release.outputs.image }}:buildcache-${{ matrix.arch }},mode=max,ignore-error=true

  publish:
    name: Publish manifest
    needs: [release, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform manifest
        env:
          IMAGE: ${{ needs.release.outputs.image }}
          VERSION: ${{ needs.release.outputs.version }}
          LATEST: ${{ needs.release.outputs.latest }}
          SHA: ${{ github.sha }}
        run: |
          set -- --tag "$IMAGE:v$VERSION"
          if [ "$LATEST" = true ]; then set -- "$@" --tag "$IMAGE:latest"; fi
          docker buildx imagetools create "$@" "$IMAGE:$SHA-amd64" "$IMAGE:$SHA-arm64"
